[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v
markers =
    e2e: tests that require Ollama to be running; run with pytest -m e2e, exclude with pytest -m "not e2e"
filterwarnings =
    ignore::DeprecationWarning
    ignore::pydantic.PydanticDeprecatedSince20
