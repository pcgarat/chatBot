# ChromaDB para RAG (embeddings + historial por conversación).
# Levantar: make chroma-up  (o docker compose up -d)
# La app se ejecuta en el host y se conecta a Chroma por CHROMA_HOST=http://localhost:8001.
# Puerto 8001 expuesto en el host para que la app (fuera de Docker) pueda conectarse.
# Los datos persisten en ./data/chroma (bind mount) para no perderlos al bajar el contenedor.
services:
  chroma:
    image: chromadb/chroma:latest
    container_name: chatbot-chroma
    ports:
      - "8001:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
    volumes:
      - ./data/chroma:/chroma/chroma
    restart: unless-stopped
