<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agente de órdenes</title>
  <script>
    (function () {
      var stored = localStorage.getItem("darkMode");
      var dark = stored === "true";
      if (dark) document.documentElement.setAttribute("data-theme", "dark");
      if (localStorage.getItem("leftSidebarCollapsed") === "true") {
        document.documentElement.setAttribute("data-sidebar-left", "collapsed");
      }
      if (localStorage.getItem("centerChatVisible") === "false") {
        document.documentElement.setAttribute("data-center-chat", "off");
      }
      if (localStorage.getItem("centerGalleryVisible") === "true") {
        document.documentElement.setAttribute("data-center-gallery", "on");
      }
      if (localStorage.getItem("centerQueueVisible") === "true") {
        document.documentElement.setAttribute("data-center-queue", "on");
      }
      var share = parseFloat(localStorage.getItem("centerChatGalleryShare") || "");
      if (share >= 0.28 && share <= 0.72) {
        document.documentElement.style.setProperty("--center-chat-share", String(share));
        document.documentElement.style.setProperty("--center-gallery-share", String(1 - share));
      }
      if (localStorage.getItem("composerCollapsed") === "true") {
        document.documentElement.setAttribute("data-composer", "collapsed");
      }
      if (localStorage.getItem("leftHistoryMode") === "messages") {
        document.documentElement.setAttribute("data-history-consulta", "on");
      }
      var leftW = parseInt(localStorage.getItem("sidebarLeftWidthPx") || "", 10);
      if (leftW >= 180 && leftW <= 420) {
        document.documentElement.style.setProperty("--sidebar-left-width", leftW + "px");
      }
      var rightW = parseInt(localStorage.getItem("sidebarRightWidthPx") || "", 10);
      if (rightW >= 260 && rightW <= 480) {
        document.documentElement.style.setProperty("--sidebar-right-width", rightW + "px");
      }
      var baseFs = parseFloat(localStorage.getItem("uiBaseFontScale") || "");
      if (baseFs >= 0.8 && baseFs <= 5) {
        document.documentElement.style.setProperty("--ui-base-font-scale", String(baseFs));
      }
      var leftFs = parseFloat(localStorage.getItem("sidebarLeftFontScale") || "");
      if (leftFs >= 0.8 && leftFs <= 5) {
        document.documentElement.style.setProperty("--sidebar-left-font-scale", String(leftFs));
      }
      var rightFs = parseFloat(localStorage.getItem("sidebarRightFontScale") || "");
      if (rightFs >= 0.8 && rightFs <= 5) {
        document.documentElement.style.setProperty("--sidebar-right-font-scale", String(rightFs));
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
