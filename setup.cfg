# Configuración de mutmut (tests de mutación).
# Ver: https://mutmut.readthedocs.io/
# Ejecutar: make mutation-test (o mutmut run)

[mutmut]
# Mutar solo el código de app (mismo ámbito que cobertura)
paths_to_mutate=app/

# Excluir los mismos módulos que en .coveragerc (legacy, entrada, migraciones, Protocol, Ollama real)
do_not_mutate=
    app/ollama_client.py
    app/main.py
    app/db.py
    app/providers/base.py
    app/routers/api_ollama.py

# Solo mutar líneas cubiertas (desactivado si hay error con coverage en tu entorno)
# mutate_only_covered_lines=true

# Directorio de tests (pytest recibe tests/)
pytest_add_cli_args_test_selection=tests/
