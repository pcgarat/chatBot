<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat IA con Ollama</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Chat IA</h1>
        <div class="sidebar-header-actions">
          <button type="button" id="btn-new-chat" class="btn btn-primary sidebar-header-btn" title="Nueva conversación" aria-label="Nueva conversación">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
      </div>
      <div class="sidebar-tabs" role="tablist" aria-label="Panel lateral">
        <button type="button" role="tab" id="tab-btn-conversaciones" aria-selected="true" aria-controls="tab-conversaciones" data-tab="conversaciones">Conversaciones</button>
        <button type="button" role="tab" id="tab-btn-reglas" aria-selected="false" aria-controls="tab-reglas" data-tab="reglas">Reglas</button>
        <button type="button" role="tab" id="tab-btn-parametros" aria-selected="false" aria-controls="tab-parametros" data-tab="parametros">Parámetros</button>
      </div>
      <div class="sidebar-tabpanels">
        <div role="tabpanel" id="tab-conversaciones" class="sidebar-tabpanel is-active" aria-labelledby="tab-btn-conversaciones">
          <div class="conversations-list" id="conversations-list"></div>
        </div>
        <div role="tabpanel" id="tab-reglas" class="sidebar-tabpanel" aria-labelledby="tab-btn-reglas" hidden>
          <div class="rules-tab-scroll">
            <div class="sidebar-option rules-panel">
              <label class="instructions-label">Reglas (se envían como un solo mensaje system, concatenadas con espacio):</label>
              <div id="rules-list" class="rules-list" role="list"></div>
              <div class="rules-actions">
                <div class="rules-add-existing">
                  <label class="rules-add-existing-label">Añadir regla existente:</label>
                  <select id="rule-library-select" class="rule-library-select" aria-label="Seleccionar regla de la biblioteca">
                    <option value="">-- Elegir regla --</option>
                  </select>
                  <button type="button" id="btn-add-library-rule" class="btn btn-secondary btn-small">Añadir</button>
                </div>
              </div>
            </div>
          </div>
          <div id="rules-add-block" class="rules-create-block">
            <input type="text" id="rule-new-title" class="rule-new-title" placeholder="Título" aria-label="Título" />
            <textarea id="rule-new-input" rows="2" placeholder="Contenido..." aria-label="Contenido"></textarea>
            <button type="button" id="btn-add-rule" class="btn btn-secondary btn-small">Crear y añadir</button>
          </div>
        </div>
        <div role="tabpanel" id="tab-parametros" class="sidebar-tabpanel" aria-labelledby="tab-btn-parametros" hidden>
          <div class="sidebar-accordion sidebar-accordion-params">
        <div class="accordion-section param-group" data-accordion-section="params-modelo">
          <button type="button" class="accordion-header" aria-expanded="false" aria-controls="accordion-params-modelo" id="accordion-params-modelo-btn">
            <span class="accordion-title">Selección de modelo y contexto</span>
            <svg class="accordion-chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="accordion-content" id="accordion-params-modelo" role="region" aria-labelledby="accordion-params-modelo-btn">
            <div class="sidebar-option param-option">
              <span class="param-label param-help-trigger" data-control-id="model" title="Mantén el cursor 2 s para ver ayuda">Selección de modelo (cabecera)</span>
            </div>
            <div class="sidebar-option param-option">
              <label class="param-label" for="param-truncation">Truncado del input</label>
              <select id="param-truncation" class="param-control control-disabled" disabled data-control-id="truncation">
                <option value="disabled">Desactivado (fallar si excede)</option>
                <option value="auto">Auto (recortar al inicio)</option>
              </select>
            </div>
            <div class="sidebar-option param-option">
              <label class="param-label" for="param-num-ctx">Ventana de contexto (num_ctx)</label>
              <input type="number" id="param-num-ctx" class="param-control control-disabled" disabled min="512" max="131072" placeholder="2048" data-control-id="num_ctx" />
            </div>
          </div>
        </div>
        <div class="accordion-section param-group" data-accordion-section="params-instruccion">
          <button type="button" class="accordion-header" aria-expanded="false" aria-controls="accordion-params-instruccion" id="accordion-params-instruccion-btn">
            <span class="accordion-title">Instrucción (system / prompt)</span>
            <svg class="accordion-chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="accordion-content" id="accordion-params-instruccion" role="region" aria-labelledby="accordion-params-instruccion-btn">
            <div class="sidebar-option param-option">
              <label class="param-label">Instrucción de sistema</label>
              <p class="param-note">Usa el cuadro "Instrucciones para todos los mensajes" en Reglas. Este control se activará cuando se soporte por proveedor.</p>
              <textarea id="param-system-extra" class="param-control control-disabled" disabled rows="2" placeholder="Instrucción adicional (desactivado)" data-control-id="system_instruction"></textarea>
            </div>
          </div>
        </div>
        <div class="accordion-section param-group" data-accordion-section="params-longitud">
          <button type="button" class="accordion-header" aria-expanded="false" aria-controls="accordion-params-longitud" id="accordion-params-longitud-btn">
            <span class="accordion-title">Longitud y paradas</span>
            <svg class="accordion-chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="accordion-content" id="accordion-params-longitud" role="region" aria-labelledby="accordion-params-longitud-btn">
            <div class="sidebar-option param-option">
              <label class="param-label" for="param-max-tokens">Límite de tokens de salida</label>
              <input type="number" id="param-max-tokens" class="param-control control-disabled" disabled min="1" max="128000" placeholder="ej. 512" data-control-id="max_tokens" />
            </div>
            <div class="sidebar-option param-option">
              <label class="param-label" for="param-stop-sequences">Stop sequences</label>
              <input type="text" id="param-stop-sequences" class="param-control control-disabled" disabled placeholder="ej. \n\n o \nUsuario:" data-control-id="stop_sequences" />
            </div>
          </div>
        </div>
        <div class="accordion-section param-group" data-accordion-section="params-aleatoriedad">
          <button type="button" class="accordion-header" aria-expanded="false" aria-controls="accordion-params-aleatoriedad" id="accordion-params-aleatoriedad-btn">
            <span class="accordion-title">Aleatoriedad y diversidad</span>
            <svg class="accordion-chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="accordion-content" id="accordion-params-aleatoriedad" role="region" aria-labelledby="accordion-params-aleatoriedad-btn">
            <div class="sidebar-option param-option">
              <label class="param-label" for="param-temperature">Temperatura</label>
              <input type="number" id="param-temperature" class="param-control control-disabled" disabled min="0" max="2" step="0.1" placeholder="0.8" data-control-id="temperature" />
            </div>
            <div class="sidebar-option param-option">
              <label class="param-label" for="param-top-p">Top-p (nucleus)</label>
              <input type="number" id="param-top-p" class="param-control control-disabled" disabled min="0" max="1" step="0.05" placeholder="0.9" data-control-id="top_p" />
            </div>
            <div class="sidebar-option param-option">
              <label class="param-label" for="param-top-k">Top-k</label>
              <input type="number" id="param-top-k" class="param-control control-disabled" disabled min="0" max="500" placeholder="40" data-control-id="top_k" />
            </div>
            <div class="sidebar-option param-option">
              <label class="param-label" for="param-min-p">Min-p (avanzado)</label>
              <input type="number" id="param-min-p" class="param-control control-disabled" disabled min="0" max="1" step="0.01" placeholder="0" data-control-id="min_p" />
            </div>
            <div class="sidebar-option param-option">
              <label class="param-label" for="param-seed">Semilla</label>
              <input type="number" id="param-seed" class="param-control control-disabled" disabled placeholder="0 = aleatorio" data-control-id="seed" />
            </div>
            <div class="sidebar-option param-option">
              <label class="param-label" for="param-presence-penalty">Presence penalty</label>
              <input type="number" id="param-presence-penalty" class="param-control control-disabled" disabled min="-2" max="2" step="0.1" placeholder="0" data-control-id="presence_penalty" />
            </div>
            <div class="sidebar-option param-option">
              <label class="param-label" for="param-frequency-penalty">Frequency penalty</label>
              <input type="number" id="param-frequency-penalty" class="param-control control-disabled" disabled min="-2" max="2" step="0.1" placeholder="0" data-control-id="frequency_penalty" />
            </div>
          </div>
        </div>
        <div class="accordion-section param-group" data-accordion-section="params-seguridad">
          <button type="button" class="accordion-header" aria-expanded="false" aria-controls="accordion-params-seguridad" id="accordion-params-seguridad-btn">
            <span class="accordion-title">Seguridad y formato</span>
            <svg class="accordion-chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="accordion-content" id="accordion-params-seguridad" role="region" aria-labelledby="accordion-params-seguridad-btn">
            <div class="sidebar-option param-option">
              <label class="param-label" for="param-response-format">Formato de salida</label>
              <select id="param-response-format" class="param-control control-disabled" disabled data-control-id="response_format">
                <option value="text">Texto</option>
                <option value="json_object">JSON objeto</option>
                <option value="json_schema">JSON Schema</option>
              </select>
            </div>
            <div class="sidebar-option param-option">
              <label class="param-label" for="param-safety-mode">Modo seguridad</label>
              <select id="param-safety-mode" class="param-control control-disabled" disabled data-control-id="safety_mode">
                <option value="default">Por defecto</option>
                <option value="contextual">Contextual</option>
                <option value="off">Desactivado</option>
              </select>
            </div>
          </div>
        </div>
          </div>
        <div class="params-source-row">
          <span id="params-source-label" class="params-source-label" aria-live="polite"></span>
          <button type="button" id="btn-reset-params" class="btn-icon btn-reset-params-inline" title="Restaurar parámetros por defecto" aria-label="Restaurar parámetros">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          </button>
        </div>
        </div>
      </div>
      <div class="sidebar-footer">
        <div class="sidebar-option sidebar-debug-option">
          <label class="debug-label">
            <input type="checkbox" id="show-debug-mode" title="Mostrar request/response completo enviado al LLM" />
            <span>Mostrar debug LLM</span>
          </label>
        </div>
      </div>
    </aside>
    <main class="chat-area">
      <div class="chat-header">
        <input type="text" id="conversation-title" class="conversation-title-input" placeholder="Título de la conversación" />
        <div class="header-actions">
          <label class="provider-label">
            Proveedor:
            <select id="provider-select"></select>
          </label>
          <label class="model-label">
            Modelo:
            <div class="model-select-wrap">
              <input type="text" id="model-select-input" class="model-select-input" autocomplete="off" placeholder="Escribir para filtrar..." aria-label="Modelo (escribir para filtrar)" aria-autocomplete="list" aria-expanded="false" aria-controls="model-select-list" />
              <select id="model-select" class="model-select-native" aria-hidden="true" tabindex="-1"></select>
              <ul id="model-select-list" class="model-select-list" role="listbox" aria-hidden="true"></ul>
            </div>
            <button type="button" id="btn-refresh-models" class="btn-icon" title="Recargar lista de modelos">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
            </button>
            <button type="button" id="btn-clear-memory" class="btn-icon" title="Limpiar memoria (descargar modelos de VRAM/RAM)" aria-label="Limpiar memoria">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
            </button>
            <button type="button" id="btn-model-info" class="btn-icon" title="Ficha e información del modelo" aria-label="Info del modelo">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            </button>
          </label>
          <button type="button" id="btn-save" class="btn btn-secondary">Guardar</button>
        </div>
        <div id="context-usage-row" class="context-usage-row" aria-live="polite">
          <span id="context-usage-label" class="context-usage-label">Uso de contexto:</span>
          <div id="context-usage-bar-wrap" class="context-usage-bar-wrap" hidden>
            <div id="context-usage-bar" class="context-usage-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Tokens de prompt y respuesta">
              <div id="context-usage-segment-prompt" class="context-usage-segment context-usage-prompt"></div>
              <div id="context-usage-segment-completion" class="context-usage-segment context-usage-completion"></div>
            </div>
          </div>
          <span id="context-usage-text" class="context-usage-text"></span>
          <div class="context-usage-right-controls">
            <div class="font-size-controls" role="group" aria-label="Tamaño del texto de la conversación">
              <button type="button" id="btn-font-size-decrease" class="btn-icon font-size-btn" title="Reducir tamaño del texto" aria-label="Reducir tamaño del texto">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
              <button type="button" id="btn-font-size-increase" class="btn-icon font-size-btn" title="Aumentar tamaño del texto" aria-label="Aumentar tamaño del texto">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
            </div>
            <span class="context-usage-separator" aria-hidden="true"></span>
            <div class="history-turns-inline" role="group" aria-label="History messages in prompt">
              <label for="history-turns-input" class="history-turns-label">history messages:</label>
              <input type="number" id="history-turns-input" class="history-turns-input" min="0" max="100" value="5" aria-label="History messages (user+assistant pairs) in prompt; 0 = only current message" />
            </div>
            <div class="chromadb-inline" role="group" aria-label="Guardar en ChromaDB">
            <label for="save-to-chromadb-select" class="chromadb-inline-label">Chroma:</label>
            <select id="save-to-chromadb-select" class="chromadb-inline-select" aria-label="Guardar en ChromaDB (RAG)">
              <option value="none" selected>Nada</option>
              <option value="user">Usuario</option>
              <option value="assistant">Asist.</option>
              <option value="both">Ambas</option>
            </select>
            </div>
          </div>
        </div>
      </div>
      <div class="messages-container" id="messages-container"></div>
      <div class="input-area">
        <div class="instruction-once-row">
          <label>Instrucción solo para este mensaje (opcional):</label>
          <input type="text" id="instruction-override" placeholder="Ej: Responde en una sola frase." />
        </div>
        <div class="send-row">
          <textarea id="message-input" rows="2" placeholder="Escribe tu mensaje..."></textarea>
          <div class="send-row-buttons">
            <button type="button" id="btn-cancel-message" class="btn-icon" title="Cancelar último mensaje" aria-label="Cancelar último mensaje">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
            <button type="button" id="btn-send" class="btn btn-primary">Enviar</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div id="model-info-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="model-info-modal-title" hidden>
    <div class="modal-content model-info-modal-content">
      <h2 id="model-info-modal-title" class="modal-title">Ficha del modelo</h2>
      <p id="model-info-modal-subtitle" class="model-info-subtitle"></p>
      <div id="model-info-provider-block" class="model-info-block model-info-provider">
        <h3 class="model-info-block-title">Información del proveedor</h3>
        <div id="model-info-provider-content" class="model-info-provider-content"></div>
        <div id="model-info-refresh-row" class="model-info-actions">
          <button type="button" id="btn-model-info-refresh" class="btn btn-secondary">Refrescar desde proveedor</button>
          <span id="model-info-refresh-status" class="model-info-status"></span>
        </div>
      </div>
      <div id="model-info-user-block" class="model-info-block model-info-user">
        <h3 class="model-info-block-title">Datos de usuario</h3>
        <div class="model-info-field">
          <label class="model-info-label">
            <input type="checkbox" id="model-info-uncensored" />
            <span>Uncensored</span>
          </label>
        </div>
        <div class="model-info-field">
          <label class="model-info-label">Instrucciones que funcionan bien</label>
          <div id="model-info-instructions-list" class="model-info-instructions-list"></div>
          <button type="button" id="btn-add-instruction" class="btn btn-secondary btn-small">Añadir línea</button>
        </div>
        <div class="model-info-field">
          <label class="model-info-label">Tags</label>
          <div id="model-info-tags-container" class="model-info-tags-container">
            <div id="model-info-tags-chips" class="model-info-tags-chips"></div>
            <div class="model-info-tags-input-wrap">
              <input type="text" id="model-info-tags-input" class="model-info-tags-input" placeholder="Escribe y pulsa Enter o elige de la lista" autocomplete="off" />
              <div id="model-info-tags-suggestions" class="model-info-tags-suggestions" hidden></div>
            </div>
          </div>
        </div>
      </div>
      <div class="model-info-modal-actions">
        <button type="button" id="btn-model-info-save" class="btn btn-primary">Guardar</button>
        <button type="button" id="model-info-modal-close" class="btn btn-secondary">Cerrar</button>
      </div>
    </div>
  </div>
  <div id="rule-edit-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="rule-edit-modal-title" hidden>
    <div class="modal-content rule-edit-modal-content">
      <h2 id="rule-edit-modal-title" class="modal-title">Editar regla</h2>
      <div class="rule-edit-form">
        <label class="rule-edit-label" for="rule-edit-title">Título</label>
        <input type="text" id="rule-edit-title" class="rule-edit-input" placeholder="Título" />
        <label class="rule-edit-label" for="rule-edit-content">Contenido</label>
        <textarea id="rule-edit-content" class="rule-edit-textarea" rows="4" placeholder="Contenido de la regla"></textarea>
      </div>
      <div class="rule-edit-actions">
        <button type="button" id="rule-edit-btn-delete" class="btn rule-edit-btn-delete">Eliminar regla</button>
        <button type="button" id="rule-edit-btn-save" class="btn btn-primary">Guardar</button>
        <button type="button" id="rule-edit-btn-save-new" class="btn btn-secondary">Guardar nuevo</button>
      </div>
    </div>
  </div>
  <script src="/static/js/app.js"></script>
</body>
</html>
